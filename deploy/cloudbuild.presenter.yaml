# Cloud Build: Overtone V2 presenter (Recall output-media)

substitutions:
  _REGION: us-central1
  _RUN_REGION: us-central1
  _SERVICE: overtone-v2-presenter
  _AR_REPOSITORY: overtone
  _IMAGE_NAME: overtone-v2-presenter
  _VITE_API_BASE: https://overtone-v2-api-4idrhaffca-uc.a.run.app
  _VITE_WS_BASE: wss://overtone-v2-api-4idrhaffca-uc.a.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - --build-arg
      - VITE_API_BASE=${_VITE_API_BASE}
      - --build-arg
      - VITE_WS_BASE=${_VITE_WS_BASE}
      - -f
      - Dockerfile
      - .
    dir: presenter

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - --region=${_RUN_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --max-instances=3

options:
  logging: CLOUD_LOGGING_ONLY
