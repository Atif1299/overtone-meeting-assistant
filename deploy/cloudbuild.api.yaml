# Cloud Build: Overtone V2 API → Artifact Registry → Cloud Run

substitutions:
  _REGION: us-central1
  _RUN_REGION: us-central1
  _SERVICE: overtone-v2-api
  _AR_REPOSITORY: overtone
  _IMAGE_NAME: overtone-v2-api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - ./backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - --region=${_RUN_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --timeout=3600
      - --cpu=1
      - --memory=1Gi
      - --min-instances=1
      - --max-instances=1

options:
  logging: CLOUD_LOGGING_ONLY
