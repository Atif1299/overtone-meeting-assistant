substitutions:
  _REGION: us-central1
  _IMAGE_NAME: overtone-v2-presenter
  _AR_REPOSITORY: overtone
  _VITE_API_BASE: https://overtone-v2-api-4idrhaffca-uc.a.run.app
  _VITE_WS_BASE: wss://overtone-v2-api-4idrhaffca-uc.a.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:latest
      - --build-arg
      - VITE_API_BASE=${_VITE_API_BASE}
      - --build-arg
      - VITE_WS_BASE=${_VITE_WS_BASE}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:latest
options:
  logging: CLOUD_LOGGING_ONLY
